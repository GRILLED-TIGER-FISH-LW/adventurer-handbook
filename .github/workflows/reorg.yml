name: Reorg

# 一次性的机械改动机器人（和主仓库那份同一个，清单区就在下面 env 里）。
#   用法：Actions 里选 Reorg → Run workflow（清单名用默认的即可）
#   → 它在 reorg-<清单名> 分支上做完、跑一次 npm run build → 你去 compare 页面合并。
#   任一步失败都不会推分支、不会动 main。
#
# 清单格式
#   ① MOVES    一行一条：旧路径 -> 新路径
#   ② EDITS    一条一个块：### 文件路径 + <<<< 原文 >>>> + <<<< 新文 >>>>
#   ③ DELETES  一行一个路径（这份清单里就一条：它自己）
#   ④ CHECKS   一行一条命令，非 0 即中止
#
# 这一批（image-dict）：主仓库把字典改名了（icon-dict.js → image-dict.js、
#   全局 window.ICON_DICT → window.IMAGE_DICT），本仓库那 4 个页面按绝对 URL 读它，
#   必须跟着改，否则图标全没了。
#   · 顺序：**先跑主仓库那批并合并部署**，再跑这批（最后一条自检会去抓主仓库的文件，抓不到就中止）
#   · 本文件用完即弃：DELETES 里写了它自己，合并进 main 之后这个工作流就没了
#   · 下次还要用，去 genshin-guide 的 AGENTS.md 第六节 / 它的 .github/workflows/reorg.yml 抄一份

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 清单名（会建 reorg-<名字> 分支）
        required: true
        default: image-dict

permissions:
  contents: write

env:
  # ---------- ① 搬文件 ----------
  MOVES: |
    # 这批不搬文件

  # ---------- ② 替换 ----------
  EDITS: |
    ### src/views/GiftSet.vue
    <<<<
    const ICON_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/gi-icons/icon-dict.js'
    >>>>
    <<<<
    const IMAGE_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/image-dict.js'
    >>>>

    ### src/views/GiftSet.vue
    <<<<
        const dict = await loadGlobalScript(ICON_DICT_URL, 'ICON_DICT').catch(() => null)
    >>>>
    <<<<
        const dict = await loadGlobalScript(IMAGE_DICT_URL, 'IMAGE_DICT').catch(() => null)
    >>>>

    ### src/views/GiftSetEditor.vue
    <<<<
    const ICON_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/gi-icons/icon-dict.js'
    >>>>
    <<<<
    const IMAGE_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/image-dict.js'
    >>>>

    ### src/views/GiftSetEditor.vue
    <<<<
        const dict = await loadGlobalScript(ICON_DICT_URL, 'ICON_DICT').catch(() => null)
    >>>>
    <<<<
        const dict = await loadGlobalScript(IMAGE_DICT_URL, 'IMAGE_DICT').catch(() => null)
    >>>>

    ### src/views/Tales.vue
    <<<<
    const ICON_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/gi-icons/icon-dict.js'
    >>>>
    <<<<
    const IMAGE_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/image-dict.js'
    >>>>

    ### src/views/Tales.vue
    <<<<
        const dict = await loadGlobalScript(ICON_DICT_URL, 'ICON_DICT').catch(() => null)
    >>>>
    <<<<
        const dict = await loadGlobalScript(IMAGE_DICT_URL, 'IMAGE_DICT').catch(() => null)
    >>>>

    ### src/views/TalesEditor.vue
    <<<<
    const ICON_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/gi-icons/icon-dict.js'
    >>>>
    <<<<
    const IMAGE_DICT_URL =
      'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/image-dict.js'
    >>>>

    ### src/views/TalesEditor.vue
    <<<<
        const dict = await loadGlobalScript(ICON_DICT_URL, 'ICON_DICT').catch(() => null)
    >>>>
    <<<<
        const dict = await loadGlobalScript(IMAGE_DICT_URL, 'IMAGE_DICT').catch(() => null)
    >>>>

    ### src/views/GiftSetEditor.vue
    <<<<
      lines.push(' * · preferredCharacters 存角色中文名，按 icon-dict order 升序')
    >>>>
    <<<<
      lines.push(' * · preferredCharacters 存角色中文名，按图片字典 order 升序')
    >>>>

    ### public/data/gift-set.js
    <<<<
     * · preferredCharacters 存角色中文名，按 icon-dict order 升序
    >>>>
    <<<<
     * · preferredCharacters 存角色中文名，按图片字典 order 升序
    >>>>

    ### src/icons/index.js
    <<<<
     * 图标字典 · Fluent UI System Icons（取自 genshin-guide/shared/ui-icons.js）
