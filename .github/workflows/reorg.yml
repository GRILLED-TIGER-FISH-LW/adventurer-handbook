    ### 三份文档怎么分工

    | 文件 | 给谁看 |
    |---|---|
    | `README.md` | 使用者：怎么用、数据存哪、常见问题 |
    | `CHANGELOG.md` | 里程碑（起因 → 经过 → 结果，当前月份按天一条） |
    | `AGENTS.md` | 本文件：AI 的维护手册（流程 / 约定 / 诊断） |

    ### 批量机械改动（临时 Action）

    挪文件、全站同一个字符串替换、删几个文件，**不要一个个文件去改** —— 照抄主仓库的 `.github/workflows/reorg.yml`（清单式：`MOVES` / `EDITS` / `DELETES` / `CHECKS` 四段写在文件顶部 `env` 里），在本仓库默认分支上建出来、直接 Run workflow（从 `main` 跑，清单名会变成分支名 `reorg-<名字>`）。

    - 工序固定：`MOVES` → `EDITS` → `DELETES` → `CHECKS` → 构建 → 才提交推送；**只推 `reorg-<名字>` 分支，永远不碰 main**；找不到原文、自检没过、构建失败都不推。
    - `EDITS` 里的文件名要写**搬完之后的路径**；`CHECKS` 查「实际行为」而不是名字 —— 新文注释里顺手写个被检查的字符串，会把自己卡住（栽过）。
    - 验收：`https://github.com/GRILLED-TIGER-FISH-LW/adventurer-handbook/compare/main...reorg-<名字>` → 开 PR → Merge → 删分支。手机上看不到分支横幅，直接用这条链接。
    - 只适合机械改动；要重写的东西（搬页面、改交互）不适用。
    - 用完就删（2026-11 那次改名就是这么干完顺手自删的），下次要用再抄一份。
    >>>>

  # ---------- ③ 删文件 / 目录 ----------
  DELETES: |
    .github/workflows/reorg.yml

  # ---------- ④ 自检 ----------
  CHECKS: |
    grep -qF '## 📌 备注与致谢' README.md
    grep -qF 'adventurer-handbook-theme' README.md
    grep -qF '游逸旅闻存档记录-100000000-20261108.json' README.md
    grep -qF '导入是覆盖' README.md
    grep -qF '读它的地方有 4 个' AGENTS.md
    grep -qF '批量机械改动（临时 Action）' AGENTS.md
    grep -qF '三份文档怎么分工' AGENTS.md
    grep -qF '2026-11-08 · 跟随主仓库字典改名，README 补全' CHANGELOG.md
    grep -qF '### 2026-11-04 · 技术栈迁移完成' CHANGELOG.md
    ! grep -n '^| *$' README.md
    ! grep -n 'icon-dict\.js\|icon-loader\.js\|ICON_DICT\|gi-icons' README.md AGENTS.md
    test "$(tail -n 1 README.md)" = '</div>'
    for a in start tales giftset save faq structure; do grep -q "id=\"$a\"" README.md || { echo "缺锚点 $a"; exit 1; }; done
    test ! -e .github/workflows/reorg.yml

jobs:
  reorg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 按清单区改
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          def pick(text):
              return [l.strip() for l in text.split('\n') if l.strip() and not l.strip().startswith('#')]

          def split_records(text):
              # 只在「标记区外」的行首 ### 才当新块的开始 —— 原文 / 新文里出现
              # 行首 ###（比如要改文档里的小标题）不会被切错。
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  guarded = inside or s in ('<<<<', '>>>>')
                  if s == '<<<<':
                      inside = True
                  elif s == '>>>>':
                      inside = False
                  if not guarded and line.startswith('###'):
                      if cur is not None:
                          out.append('\n'.join(cur))
                      cur = [line[3:].strip()]
                  else:
                      if cur is None:
                          if not line.strip():
                              continue
                          cur = []
                      cur.append(line)
              if cur:
                  out.append('\n'.join(cur))
              return out

          def blocks(text):
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  if s == '<<<<':
                      inside, cur = True, []
                      continue
                  if s == '>>>>':
                      inside = False
                      out.append('\n'.join(cur))
                      cur = None
                      continue
                  if inside:
                      cur.append(line)
              return out

          def die(msg):
              print('中止：' + msg)
              sys.exit(1)

          # ① 搬
          for entry in pick(os.environ.get('MOVES', '')):
              from_, sep, to = entry.partition(' -> ')
              if not sep:
                  die('MOVES 这行没有 -> ：' + entry)
              subprocess.run(['git', 'mv', from_, to], check=True)
              print('mv %s -> %s' % (from_, to))

          # ② 替换
          edits = os.environ.get('EDITS', '')
          records = split_records(edits)
          if edits.strip() and not records:
              die('EDITS 里没有 ### 头')
          for rec in records:
              lines = rec.split('\n')
              path = lines[0].strip()
              got = blocks('\n'.join(lines[1:]))
              if len(got) != 2:
                  die('%s：应有原文/新文两段 <<<< … >>>>，实际 %d 段' % (path, len(got)))
              src, dst = got
              p = Path(path)
              if not p.is_file():
                  die('缺文件：' + path)
              text = p.read_text(encoding='utf-8')
              if src not in text:
                  die('没找到原文：' + path)
              p.write_text(text.replace(src, dst), encoding='utf-8')
              print('改了 ' + path)

          # ③ 删
          for path in pick(os.environ.get('DELETES', '')):
              subprocess.run(['git', 'rm', '-r', '-q', '--ignore-unmatch', path], check=True)
              print('rm ' + path)

          # ④ 自检：失败时把命令输出也打出来
          for check in pick(os.environ.get('CHECKS', '')):
              print('check: ' + check)
              r = subprocess.run(['bash', '-c', check], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout, r.stderr)
                  die('自检没过：' + check)
              print('  ok')

          subprocess.run(['git', 'add', '-A'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              die('清单没有产生任何改动')
          print(subprocess.run(['git', 'status', '--short'], capture_output=True, text=True).stdout)
          PY

      - name: 构建验证
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 推到分支
        run: |
          set -euo pipefail
          B="${{ inputs.batch }}"
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"
          git commit -m "reorg: $B"
          git push -f origin "HEAD:refs/heads/reorg-$B"
