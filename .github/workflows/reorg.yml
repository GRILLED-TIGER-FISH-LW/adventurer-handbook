     * UI 图标 · Fluent UI System Icons（取自 genshin-guide/shared/ui-icons.js）
    >>>>

    ### AGENTS.md
    <<<<
        ├── icons/             图标字典
    >>>>
    <<<<
        ├── icons/             UI 图标（Fluent）
    >>>>

    ### AGENTS.md
    <<<<
    https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/gi-icons/icon-dict.js
    >>>>
    <<<<
    https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/image-dict.js
    >>>>

    ### AGENTS.md
    <<<<
    角色头像字典（几 MB，不适合本地化）。**不要再引入**主仓库的 `theme.css` / `ui-icons.js` / `dropdown.js` / `icon-loader.js`。
    >>>>
    <<<<
    图片字典（头像 / 名片 / 立绘，约 75KB，跨仓库共用所以不本地化）。读它用 `loadGlobalScript(URL, 'IMAGE_DICT')`，拿到的是整个字典对象（`dict.characters[代号].name` 这样取）。**不要再引入**主仓库的 `theme.css` / `ui-icons.js` / `dropdown.js` / `image-loader.js`。
    >>>>

  # ---------- ③ 删文件 / 目录 ----------
  DELETES: |
    .github/workflows/reorg.yml

  # ---------- ④ 自检 ----------
  CHECKS: |
    ! grep -rn 'ICON_DICT\|ICON_LIB\|icon-dict\|icon-loader\|gi-icons' src public AGENTS.md
    grep -q 'shared/image-dict.js' src/views/GiftSet.vue
    grep -q 'shared/image-dict.js' src/views/TalesEditor.vue
    test "$(grep -rc IMAGE_DICT_URL src/views/GiftSet.vue src/views/GiftSetEditor.vue src/views/Tales.vue src/views/TalesEditor.vue | awk -F: '{s+=$2} END {print s}')" = 8
    test "$(grep -rc "IMAGE_DICT'" src/views/GiftSet.vue src/views/GiftSetEditor.vue src/views/Tales.vue src/views/TalesEditor.vue | awk -F: '{s+=$2} END {print s}')" = 4
    test ! -e .github/workflows/reorg.yml
    node --check src/icons/index.js && node --check public/data/gift-set.js
    grep -qF "lines.push(' * · preferredCharacters 存角色中文名，按图片字典 order 升序')" src/views/GiftSetEditor.vue
    curl -sf -o /dev/null https://raw.githubusercontent.com/GRILLED-TIGER-FISH-LW/genshin-guide/main/public/shared/image-dict.js

jobs:
  reorg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 按清单区改
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          def pick(text):
              return [l.strip() for l in text.split('\n') if l.strip() and not l.strip().startswith('#')]

          def split_records(text):
              # 只在「标记区外」的行首 ### 才当新块的开始（原文 / 新文里出现 ### 也不会切错）
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  guarded = inside or s in ('<<<<', '>>>>')
                  if s == '<<<<':
                      inside = True
                  elif s == '>>>>':
                      inside = False
                  if not guarded and line.startswith('###'):
                      if cur is not None:
                          out.append('\n'.join(cur))
                      cur = [line[3:].strip()]
                  else:
                      if cur is None:
                          if not line.strip():
                              continue
                          cur = []
                      cur.append(line)
              if cur:
                  out.append('\n'.join(cur))
              return out

          def blocks(text):
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  if s == '<<<<':
                      inside, cur = True, []
                      continue
                  if s == '>>>>':
                      inside = False
                      out.append('\n'.join(cur))
                      cur = None
                      continue
                  if inside:
                      cur.append(line)
              return out

          def die(msg):
              print('中止：' + msg)
              sys.exit(1)

          # ① 搬
          for entry in pick(os.environ.get('MOVES', '')):
              from_, sep, to = entry.partition(' -> ')
              if not sep:
                  die('MOVES 这行没有 -> ：' + entry)
              subprocess.run(['git', 'mv', from_, to], check=True)
              print('mv %s -> %s' % (from_, to))

          # ② 替换
          edits = os.environ.get('EDITS', '')
          records = split_records(edits)
          if edits.strip() and not records:
              die('EDITS 里没有 ### 头')
          for rec in records:
              lines = rec.split('\n')
              path = lines[0].strip()
              got = blocks('\n'.join(lines[1:]))
              if len(got) != 2:
                  die('%s：应有原文/新文两段 <<<< … >>>>，实际 %d 段' % (path, len(got)))
              src, dst = got
              p = Path(path)
              if not p.is_file():
                  die('缺文件：' + path)
              text = p.read_text(encoding='utf-8')
              if src not in text:
                  die('没找到原文：' + path)
              p.write_text(text.replace(src, dst), encoding='utf-8')
              print('改了 ' + path)

          # ③ 删
          for path in pick(os.environ.get('DELETES', '')):
              subprocess.run(['git', 'rm', '-r', '-q', '--ignore-unmatch', path], check=True)
              print('rm ' + path)

          # ④ 自检：失败时把命令输出也打出来
          for check in pick(os.environ.get('CHECKS', '')):
              print('check: ' + check)
              r = subprocess.run(['bash', '-c', check], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout, r.stderr)
                  die('自检没过：' + check)
              print('  ok')

          subprocess.run(['git', 'add', '-A'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              die('清单没有产生任何改动')
          print(subprocess.run(['git', 'status', '--short'], capture_output=True, text=True).stdout)
          PY

      - name: 构建验证
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 推到分支
        run: |
          set -euo pipefail
          B="${{ inputs.batch }}"
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"
          git commit -m "reorg: $B"
          git push -f origin "HEAD:refs/heads/reorg-$B"
