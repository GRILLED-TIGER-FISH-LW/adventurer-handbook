    node -e 'const s=require("fs").readFileSync("src/views/TalesEditor.vue","utf8");const m=s.match(/const DATA_URL = (.*)\nconst FILE_NAME = (.*)\n/);if(!m)throw new Error("没挨着");const DATA_URL=eval(m[1]),n=eval(m[2]);if(n!=="tales.js")throw new Error("导出名="+n);console.log("TalesEditor -> "+n)'
    node -e 'const s=require("fs").readFileSync("src/views/GiftSetEditor.vue","utf8");const m=s.match(/const DATA_URL = (.*)\nconst FILE_NAME = (.*)\n/);if(!m)throw new Error("没挨着");const DATA_URL=eval(m[1]),n=eval(m[2]);if(n!=="gift-set.js")throw new Error("导出名="+n);console.log("GiftSetEditor -> "+n)'

jobs:
  reorg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 按清单区改
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          def pick(text):
              return [l.strip() for l in text.split('\n') if l.strip() and not l.strip().startswith('#')]

          def split_records(text):
              # 只在「标记区外」的行首 ### 才当新块的开始 —— 原文 / 新文里出现
              # 行首 ###（比如要改文档里的小标题）不会被切错。
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  guarded = inside or s in ('<<<<', '>>>>')
                  if s == '<<<<':
                      inside = True
                  elif s == '>>>>':
                      inside = False
                  if not guarded and line.startswith('###'):
                      if cur is not None:
                          out.append('\n'.join(cur))
                      cur = [line[3:].strip()]
                  else:
                      if cur is None:
                          if not line.strip():
                              continue
                          cur = []
                      cur.append(line)
              if cur:
                  out.append('\n'.join(cur))
              return out

          def blocks(text):
              out, cur, inside = [], None, False
              for line in text.split('\n'):
                  s = line.strip()
                  if s == '<<<<':
                      inside, cur = True, []
                      continue
                  if s == '>>>>':
                      inside = False
                      out.append('\n'.join(cur))
                      cur = None
                      continue
                  if inside:
                      cur.append(line)
              return out

          def die(msg):
              print('中止：' + msg)
              sys.exit(1)

          # ① 搬
          for entry in pick(os.environ.get('MOVES', '')):
              from_, sep, to = entry.partition(' -> ')
              if not sep:
                  die('MOVES 这行没有 -> ：' + entry)
              subprocess.run(['git', 'mv', from_, to], check=True)
              print('mv %s -> %s' % (from_, to))

          # ② 替换
          edits = os.environ.get('EDITS', '')
          records = split_records(edits)
          if edits.strip() and not records:
              die('EDITS 里没有 ### 头')
          for rec in records:
              lines = rec.split('\n')
              path = lines[0].strip()
              got = blocks('\n'.join(lines[1:]))
              if len(got) != 2:
                  die('%s：应有原文/新文两段 <<<< … >>>>，实际 %d 段' % (path, len(got)))
              src, dst = got
              p = Path(path)
              if not p.is_file():
                  die('缺文件：' + path)
              text = p.read_text(encoding='utf-8')
              if src not in text:
                  die('没找到原文：' + path)
              p.write_text(text.replace(src, dst), encoding='utf-8')
              print('改了 ' + path)

          # ③ 删
          for path in pick(os.environ.get('DELETES', '')):
              subprocess.run(['git', 'rm', '-r', '-q', '--ignore-unmatch', path], check=True)
              print('rm ' + path)

          # ④ 自检：失败时把命令输出也打出来
          for check in pick(os.environ.get('CHECKS', '')):
              print('check: ' + check)
              r = subprocess.run(['bash', '-c', check], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout, r.stderr)
                  die('自检没过：' + check)
              print('  ok')

          subprocess.run(['git', 'add', '-A'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              die('清单没有产生任何改动')
          print(subprocess.run(['git', 'status', '--short'], capture_output=True, text=True).stdout)
          PY

      - name: 构建验证
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 推到分支
        run: |
          set -euo pipefail
          B="${{ inputs.batch }}"
          git config user.name "reorg-bot"
          git config user.email "reorg-bot@users.noreply.github.com"
          git commit -m "reorg: $B"
          git push -f origin "HEAD:refs/heads/reorg-$B"
