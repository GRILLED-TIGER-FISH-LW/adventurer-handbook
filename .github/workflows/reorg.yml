    ### 2026-11-08 · 跟随主仓库字典改名，README 补全

    - **起因**：两件事。① 主仓库把跨仓库那份字典改了名（`icon-dict.js` → `image-dict.js`、全局 `ICON_DICT` → `IMAGE_DICT`）—— 四个页面按绝对 URL 读它，不跟着改就全都取不到角色图。② README 的「数据保存」一节断在半张表格上，目录里承诺的「常见问题」「项目结构」两节根本不存在。
    - **经过**：四个页面（旅闻 / 套装 + 两个编辑器）的 URL 常量与 `loadGlobalScript` 的全局名同批改掉，顺手清掉还写着旧名的几处注释与数据文件说明；改动用一份照抄主仓库的清单式临时 Action 完成（`DELETES` 里写了它自己，合并后自动消失）。README 补全「数据保存 / 导出与导入 / 游戏数据从哪来 / 常见问题 / 项目结构 / 致谢」，AGENTS 补「三份文档怎么分工」与「批量机械改动」两段，并把跨仓库依赖那节对齐新名字。
    - **结果**：跨仓库依赖两边名字一致，四个页面图标恢复；README 从目录到致谢一路自洽（六个锚点都能点）；以后这边挪文件、全站替换、删文件有现成套路。

