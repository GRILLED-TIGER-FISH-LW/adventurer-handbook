name: Reorg

# 常驻工具：这份工作流通用，以后接着用 —— 换掉 env 里那四段清单 → 提交 → Run workflow。
#   跑法：Actions 里选 Reorg → Run workflow（清单名会变成分支名 reorg-<名字>）
#   → 它在 reorg-<清单名> 分支上做完、跑一次 npm run build → 你去 compare 页面合并。
#   任一步失败都不会推分支、不会动 main；只推 reorg-<名字> 分支。
#
# 清单格式
#   ① MOVES    一行一条：旧路径 -> 新路径
#   ② EDITS    一条一个块：### 文件路径 + <<<< 原文 >>>> + <<<< 新文 >>>>
#   ③ DELETES  一行一个路径（文件或目录都行）
#   ④ CHECKS   一行一条命令，非 0 即中止（失败会打印该命令的输出）
#   经验：EDITS 里的文件名要写「搬完之后的路径」（工序 MOVES → EDITS → DELETES → CHECKS）；
#         自检要查「实际行为」，别查名字 —— 新文注释里顺手写个被检查的字符串会把自己卡住（栽过）。
#   主仓库那份同款：genshin-guide/.github/workflows/reorg.yml（机身一样，只有清单不同）。
#
# 这一批（export-name）：编辑器导出文件名 + AGENTS 措辞。
#   · 两个编辑器的 DATA_URL 下面加一行 FILE_NAME（= 从 DATA_URL 里取文件名），
#     导出与提示都改用它 —— 导出直接叫 tales.js / gift-set.js，不用再手动重命名
#   · README 里「把导出的文件重命名成 tales.js」那句说明跟着改（docs 那批刚写的）
#   · CHANGELOG 把这件事并进今天的 11-08 条目
#   · AGENTS 里「批量机械改动」那段改成「这份工作流常驻」
#   · 前置：docs 那批必须已经合并（三处原文取自它）

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 清单名（会建 reorg-<名字> 分支）
        required: true
        default: export-name

permissions:
  contents: write

