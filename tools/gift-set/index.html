<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>尘歌壶赠礼套装</title>

<!-- ① 主题初始化：必须同步加载（不加 defer / async），否则首帧会闪 -->
<script src="https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/css/theme-init.js"></script>

<script>
(() => {
  const BASE = 'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/';
  const ts = Date.now();
  const withTs = (url) => url + (url.includes('?') ? '&' : '?') + `t=${ts}`;
  const loadNode = (tag, attrs) => new Promise((resolve, reject) => {
    const el = document.createElement(tag);
    Object.assign(el, attrs);
    el.onload = resolve;
    el.onerror = () => reject(new Error(`加载失败：${attrs.href || attrs.src}`));
    document.head.appendChild(el);
  });
  const loadScript = (src) => loadNode('script', { src: withTs(src) });
  const loadStyle = (href) => loadNode('link', { rel: 'stylesheet', href: withTs(href) });

  window.__bootPromise = (async () => {
    await Promise.all([
      loadStyle(BASE + 'css/theme.css'),
      loadStyle('style.css'),
      loadScript(BASE + 'ui-icons.js'),
      loadScript(BASE + 'css/dropdown.js')
    ]);
    await Promise.all([
      loadScript(BASE + 'gi-icons/icon-dict.js'),
      loadScript(BASE + 'gi-icons/icon-loader.js')
    ]);
    try {
      await loadScript('data.js');
    } catch (e) {
      console.warn('[boot] 数据字典加载失败', e);
    }
    await loadScript('app.js');
  })();

  /* ② 加载失败兜底：任一核心资源 404 时给出可见提示，而不是永久白屏 */
  window.__bootPromise.catch((e) => {
    console.error('[Boot]', e);
    const bootEl = document.querySelector('.boot-loading');
    if (bootEl) {
      bootEl.style.whiteSpace = 'pre-wrap';
      bootEl.textContent = '载入失败：' + (e && e.message ? e.message : String(e)) +
        '\n请刷新重试；若持续失败，请把这条信息反馈给维护者。';
    }
  });
})();
</script>

<style>
  html { background: var(--bg-base, #F4F1EA); }
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  [hidden] { display: none !important; }
  .boot-loading {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base, #F4F1EA); color: var(--text-tertiary, #A69E95);
    font-size: var(--fs-sm, 12px); font-family: var(--std-font, system-ui, sans-serif);
    visibility: visible;
    padding: 24px; text-align: center; line-height: 1.6;
  }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<div class="boot-loading">正在载入尘歌壶赠礼套装…</div>

<header class="gs-header">
  <input type="text" id="uidInput" class="gs-uid" placeholder="UID" maxlength="15" inputmode="numeric" autocomplete="off" spellcheck="false">
  <div class="gs-header-actions">
    <button type="button" class="btn" id="btnImport" title="导入存档">
      <span class="icon-slot" data-icon="ui.import"></span>
      <span class="btn-text">导入</span>
    </button>
    <button type="button" class="btn" id="btnExport" title="导出存档">
      <span class="icon-slot" data-icon="ui.export"></span>
      <span class="btn-text">导出</span>
    </button>
    <button type="button" class="float-btn gs-theme-btn" id="btnTheme" aria-label="切换主题" title="切换主题">
      <span class="gs-theme-sun icon-slot" data-icon="app.sun"></span>
      <span class="gs-theme-moon icon-slot" data-icon="app.moon"></span>
    </button>
  </div>
</header>

<main class="gs-main">

  <div class="gs-first-tip" id="gsFirstTip">
    先在下面选好你拥有的角色，即可开始记录赠送进度
  </div>

  <!-- ① 我的角色 -->
  <section class="gs-section" id="gsCharSection">
    <div class="gs-section-head">
      <div class="gs-section-title">
        我的角色
        <span class="count-badge" id="gsCharCount">0</span>
      </div>
      <button type="button" class="gs-toggle-btn" id="btnCharToggle" aria-label="展开/收起角色栏">
        <span class="icon-slot" data-icon="ui.chevronDown"></span>
      </button>
    </div>
    <div class="gs-section-body">
      <div class="gs-char-grid-wrap" id="gsCharGridWrap">
        <div class="gs-char-search">
          <div class="search">
            <span class="search-icon" data-icon="ui.search"></span>
            <input type="text" id="gsCharSearch" class="search-input" placeholder="搜索角色名" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="gs-char-grid" id="gsCharGrid"></div>
      </div>
    </div>
  </section>

  <!-- ② 推荐套装 -->
  <section class="gs-section" id="gsRecommendSection" hidden>
    <div class="gs-section-head">
      <div class="gs-section-title">推荐套装</div>
      <button type="button" class="gs-toggle-btn" id="btnRecommendToggle" aria-label="展开/收起推荐">
        <span class="icon-slot" data-icon="ui.chevronDown"></span>
      </button>
    </div>
    <div class="gs-section-body">
      <div class="gs-recommend-list" id="gsRecommendList"></div>
    </div>
  </section>

  <!-- ③ 全部套装 -->
  <section class="gs-section" id="gsAllSection">
    <div class="gs-section-head">
      <div class="gs-section-title">全部套装</div>
      <button type="button" class="gs-toggle-btn gs-expand-all" id="btnExpandAll" aria-label="全部展开 / 收起">
        <span class="icon-slot" data-icon="ui.chevronDown"></span>
      </button>
    </div>
    <div class="gs-section-body">
      <div class="gs-filters">
        <div class="search">
          <span class="search-icon" data-icon="ui.search"></span>
          <input type="text" id="gsSearch" class="search-input" placeholder="搜索套装名 / 角色名" autocomplete="off" spellcheck="false">
          <button type="button" class="search-clear" id="gsSearchClear" aria-label="清除">
            <span class="icon-slot" data-icon="ui.close"></span>
          </button>
        </div>
        <div class="gs-filter-row">
          <div class="dropdown" data-filter="region">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-label" id="gsRegionLabel">全部地区</span>
              <span class="dropdown-arrow">
                <span class="arrow-down" data-icon="ui.chevronDown"></span>
                <span class="arrow-up" data-icon="ui.chevronUp"></span>
              </span>
            </button>
            <div class="dropdown-panel" id="gsRegionPanel"></div>
          </div>
          <div class="dropdown" data-filter="type">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-label" id="gsTypeLabel">全部类型</span>
              <span class="dropdown-arrow">
                <span class="arrow-down" data-icon="ui.chevronDown"></span>
                <span class="arrow-up" data-icon="ui.chevronUp"></span>
              </span>
            </button>
            <div class="dropdown-panel" id="gsTypePanel"></div>
          </div>
          <div class="dropdown" data-filter="status">
            <button type="button" class="dropdown-trigger">
              <span class="dropdown-label" id="gsStatusLabel">全部状态</span>
              <span class="dropdown-arrow">
                <span class="arrow-down" data-icon="ui.chevronDown"></span>
                <span class="arrow-up" data-icon="ui.chevronUp"></span>
              </span>
            </button>
            <div class="dropdown-panel" id="gsStatusPanel"></div>
          </div>
        </div>
      </div>
      <div class="gs-set-list" id="gsSetList"></div>
      <div class="empty-state" id="gsSetEmpty" hidden></div>
    </div>
  </section>

  <!-- ④ 危险操作（与日常操作彻底分开） -->
  <div class="gs-danger-zone">
    <button type="button" class="btn btn-danger" id="btnReset">
      <span class="icon-slot" data-icon="ui.trash"></span>
      <span class="btn-text">重置全部数据</span>
    </button>
  </div>

</main>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

</body>
</html>
