<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游逸旅闻</title>

<!-- ① 主题初始化：必须同步加载（不加 defer / async），否则首帧会闪 -->
<script src="https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/css/theme-init.js"></script>

<script>
(() => {
  const BASE = 'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/';
  const ts = Date.now();
  const withTs = (url) => url + (url.includes('?') ? '&' : '?') + `t=${ts}`;
  const loadNode = (tag, attrs) => new Promise((resolve, reject) => {
    const el = document.createElement(tag);
    Object.assign(el, attrs);
    el.onload = resolve;
    el.onerror = () => reject(new Error(`加载失败：${attrs.href || attrs.src}`));
    document.head.appendChild(el);
  });
  const loadScript = (src) => loadNode('script', { src: withTs(src) });
  const loadStyle = (href) => loadNode('link', { rel: 'stylesheet', href: withTs(href) });

  window.__bootPromise = (async () => {
    await Promise.all([
      loadStyle(BASE + 'css/theme.css'),
      loadStyle('style.css'),
      loadScript(BASE + 'ui-icons.js'),
      loadScript(BASE + 'css/dropdown.js'),
      loadScript(BASE + 'gi-icons/icon-dict.js')
    ]);
    await loadScript('data.js');
    await loadScript('app.js');
  })();

  window.__bootPromise.catch((e) => {
    console.error('[Boot]', e);
    const bootEl = document.querySelector('.boot-loading');
    if (bootEl) {
      bootEl.style.whiteSpace = 'pre-wrap';
      bootEl.textContent = '载入失败：' + (e && e.message ? e.message : String(e)) +
        '\n请刷新重试；若持续失败，请把这条信息反馈给维护者。';
    }
  });
})();
</script>

<style>
  /* CSS 到位前的兜底背景（此处必须用字面值） */
  html { background: #F4F1EA; }
  html[data-theme="dark"] { background: #1A1816; }

  body { visibility: hidden; }
  body.ready { visibility: visible; }
  .boot-loading {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base, #F4F1EA);
    color: var(--text-tertiary, #A69E95);
    font-size: 12px;
    font-family: var(--std-font, system-ui, sans-serif);
    visibility: visible;
    padding: 24px; text-align: center; line-height: 1.6;
  }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<div class="boot-loading">正在加载游逸旅闻数据…</div>

<header class="app-header" id="appHeader">

  <!-- 1. 搜索 + 完成度 + 列表折叠开关 -->
  <div class="header-row row-search">
    <div class="search">
      <span class="search-icon" data-icon="ui.search"></span>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索角色名 / 旅闻名" autocomplete="off" spellcheck="false">
      <button type="button" class="search-clear" id="searchClear" aria-label="清除">
        <span data-icon="ui.close"></span>
      </button>
    </div>
    <div class="count-badge">
      <span class="counter-label">已完成</span>
      <span class="counter-done" id="counterDone">0</span>
      <span class="counter-sep">/</span>
      <span class="counter-total" id="counterTotal">156</span>
    </div>
    <button type="button" class="header-toggle" id="btnHeaderToggle"
            aria-label="收起/展开旅闻列表" aria-expanded="true">
      <span class="icon-slot" data-icon="ui.chevronDown"></span>
    </button>
  </div>

  <!-- 2. 三个筛选下拉 -->
  <div class="header-row row-filters">
    <div class="dropdown" data-key="version">
      <button type="button" class="dropdown-trigger" id="versionTrigger">
        <span class="dropdown-label" id="versionLabel">全部版本</span>
        <span class="dropdown-arrow">
          <span class="arrow-down" data-icon="ui.chevronDown"></span>
          <span class="arrow-up" data-icon="ui.chevronUp"></span>
        </span>
      </button>
      <div class="dropdown-panel" id="versionPanel"></div>
    </div>

    <div class="dropdown" data-key="status">
      <button type="button" class="dropdown-trigger" id="statusTrigger">
        <span class="dropdown-label" id="statusLabel">全部状态</span>
        <span class="dropdown-arrow">
          <span class="arrow-down" data-icon="ui.chevronDown"></span>
          <span class="arrow-up" data-icon="ui.chevronUp"></span>
        </span>
      </button>
      <div class="dropdown-panel" id="statusPanel"></div>
    </div>

    <div class="dropdown" data-key="visibility">
      <button type="button" class="dropdown-trigger" id="visibilityTrigger">
        <span class="dropdown-label" id="visibilityLabel">全部类型</span>
        <span class="dropdown-arrow">
          <span class="arrow-down" data-icon="ui.chevronDown"></span>
          <span class="arrow-up" data-icon="ui.chevronUp"></span>
        </span>
      </button>
      <div class="dropdown-panel" id="visibilityPanel"></div>
    </div>
  </div>

  <!-- 3. UID + 日常操作 -->
  <div class="header-row row-meta-actions">
    <div class="meta-left">
      <input type="text" id="uidInput" class="uid-input" placeholder="UID" maxlength="15" inputmode="numeric" autocomplete="off" spellcheck="false">
    </div>
    <div class="meta-right">
      <button type="button" class="btn" id="btnExport" title="导出存档">
        <span class="icon-slot" data-icon="ui.export"></span><span class="btn-text">导出</span>
      </button>
      <button type="button" class="btn" id="btnImport" title="导入存档">
        <span class="icon-slot" data-icon="ui.import"></span><span class="btn-text">导入</span>
      </button>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="list-host" id="listHost"></div>
  <div class="empty-state" id="emptyState" hidden>
    <span class="empty-icon" data-icon="ui.search"></span>
    <p>没有找到匹配的旅闻</p>
  </div>

  <!-- 危险区：页面内容末尾，跟着列表一起滚 -->
  <div class="danger-zone">
    <button type="button" class="btn btn-danger" id="btnClear" title="清空全部记录">
      <span class="icon-slot" data-icon="ui.trash"></span>
      <span class="btn-text">清空全部记录</span>
    </button>
  </div>
</main>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<!-- 旅闻列表折叠（不侵入 app.js，状态记在 localStorage） -->
<script>
(() => {
  const KEY = 'tales_list_collapsed';
  const btn = document.getElementById('btnHeaderToggle');
  const main = document.querySelector('.app-main');
  if (!btn || !main) return;

  const apply = (collapsed) => {
    document.body.classList.toggle('is-list-collapsed', collapsed);
    btn.setAttribute('aria-expanded', String(!collapsed));
  };

  try { apply(localStorage.getItem(KEY) === '1'); } catch {}

  btn.addEventListener('click', () => {
    const collapsed = !document.body.classList.contains('is-list-collapsed');
    apply(collapsed);
    try { localStorage.setItem(KEY, collapsed ? '1' : '0'); } catch {}
  });
})();
</script>

</body>
</html>
