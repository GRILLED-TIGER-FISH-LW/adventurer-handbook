<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>尘歌壶赠礼套装编辑器</title>

<!-- ① 主题初始化：必须同步加载（不加 defer / async），否则首帧会闪 -->
<script src="https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/css/theme-init.js"></script>

<script>
(() => {
  const BASE = 'https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/';
  const ts = Date.now();
  const withTs = (url) => url + (url.includes('?') ? '&' : '?') + `t=${ts}`;
  const loadNode = (tag, attrs) => new Promise((resolve, reject) => {
    const el = document.createElement(tag);
    Object.assign(el, attrs);
    el.onload = resolve;
    el.onerror = () => reject(new Error(`加载失败：${attrs.href || attrs.src}`));
    document.head.appendChild(el);
  });
  const loadScript = (src) => loadNode('script', { src: withTs(src) });
  const loadStyle = (href) => loadNode('link', { rel: 'stylesheet', href: withTs(href) });

  window.__bootPromise = (async () => {
    await Promise.all([
      loadStyle(BASE + 'css/theme.css'),
      loadStyle('style.css'),
      loadScript(BASE + 'ui-icons.js'),
      loadScript(BASE + 'css/dropdown.js'),
      loadScript(BASE + 'gi-icons/icon-dict.js'),
      loadScript(BASE + 'gi-icons/icon-loader.js')
    ]);
    try {
      await loadScript('../gift-set/data.js');
    } catch (e) {
      console.warn('[boot] 数据字典加载失败，仍可用「导入」', e);
    }
    await loadScript('app.js');
  })();

  /* ② 加载失败兜底：任一核心资源 404 时给出可见提示，而不是永久白屏 */
  window.__bootPromise.catch((e) => {
    console.error('[Boot]', e);
    const bootEl = document.querySelector('.boot-loading');
    if (bootEl) {
      bootEl.style.whiteSpace = 'pre-wrap';
      bootEl.textContent = '载入失败：' + (e && e.message ? e.message : String(e)) +
        '\n请刷新重试；若持续失败，请把这条信息反馈给维护者。';
    }
  });
})();
</script>

<style>
  html { background: var(--bg-base, #F4F1EA); }
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  [hidden] { display: none !important; }
  .boot-loading {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base, #F4F1EA); color: var(--text-tertiary, #A69E95);
    font-size: var(--fs-sm, 12px); font-family: var(--std-font, system-ui, sans-serif);
    visibility: visible;
    padding: 24px; text-align: center; line-height: 1.6;
  }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<div class="boot-loading">正在载入编辑器…</div>

<header class="ed-header">
  <div class="ed-title-wrap">
    <h1 class="ed-title">尘歌壶赠礼套装编辑器</h1>
    <span class="ed-dirty-dot" id="dirtyDot" hidden title="有未导出的修改"></span>
  </div>
  <div class="ed-header-actions">
    <button type="button" class="btn" id="btnReload" title="重载线上数据">
      <span class="icon-slot" data-icon="ui.reload"></span>
      <span class="btn-text">重载</span>
    </button>
    <button type="button" class="btn" id="btnImport" title="导入本地 data.js">
      <span class="icon-slot" data-icon="ui.import"></span>
      <span class="btn-text">导入</span>
    </button>
    <button type="button" class="btn" id="btnExport" title="导出 data.js">
      <span class="icon-slot" data-icon="ui.export"></span>
      <span class="btn-text">导出</span>
    </button>
    <button type="button" class="float-btn ed-theme-btn" id="btnTheme" aria-label="切换主题" title="切换主题">
      <span class="ed-theme-sun icon-slot" data-icon="app.sun"></span>
      <span class="ed-theme-moon icon-slot" data-icon="app.moon"></span>
    </button>
  </div>
</header>

<main class="ed-main">
  <aside class="ed-list-pane" id="edListPane">
    <div class="ed-filters">
      <div class="search">
        <span class="search-icon" data-icon="ui.search"></span>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索套装名 / 偏好角色" autocomplete="off" spellcheck="false">
        <button type="button" class="search-clear" id="searchClear" aria-label="清除">
          <span class="icon-slot" data-icon="ui.close"></span>
        </button>
      </div>
      <div class="ed-filter-row">
        <div class="dropdown" data-filter="type">
          <button type="button" class="dropdown-trigger">
            <span class="dropdown-label" id="typeLabel">全部类型</span>
            <span class="dropdown-arrow">
              <span class="arrow-down" data-icon="ui.chevronDown"></span>
              <span class="arrow-up" data-icon="ui.chevronUp"></span>
            </span>
          </button>
          <div class="dropdown-panel" id="typePanel"></div>
        </div>
        <div class="dropdown" data-filter="region">
          <button type="button" class="dropdown-trigger">
            <span class="dropdown-label" id="regionLabel">全部地区</span>
            <span class="dropdown-arrow">
              <span class="arrow-down" data-icon="ui.chevronDown"></span>
              <span class="arrow-up" data-icon="ui.chevronUp"></span>
            </span>
          </button>
          <div class="dropdown-panel" id="regionPanel"></div>
        </div>
      </div>
    </div>

    <div class="ed-list" id="edList"></div>

    <div class="ed-list-footer">
      <button type="button" class="btn" id="btnAdd">
        <span class="icon-slot" data-icon="ui.plus"></span>
        <span class="btn-text">新增套装</span>
      </button>
      <button type="button" class="btn" id="btnRenumber" title="按当前显示顺序重排所有 ID">
        <span class="icon-slot" data-icon="ui.reorder"></span>
        <span class="btn-text">重排 ID</span>
      </button>
    </div>
  </aside>

  <section class="ed-form-pane" id="edFormPane"></section>
</main>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".js,.txt,text/javascript,application/javascript" hidden>

</body>
</html>
