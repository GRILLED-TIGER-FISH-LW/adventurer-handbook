<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>游逸旅闻编辑器</title>

<script>
/* =========================================================================
 * 主题同步初始化（同步执行，避免 CSS 加载后重排闪）
 * ========================================================================= */
(function () {
  try {
    if (localStorage.getItem('genshin_travelers_tales_theme_v1') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();

/* =========================================================================
 * 资源加载器（全动态加载 + 强制时间戳 + 失败可见化）
 * ========================================================================= */
(async function () {
  const ts = Date.now();
  const withTs = (url) => url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + ts;

  const loadStyle = (href) => new Promise((resolve, reject) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = withTs(href);
    l.onload = resolve;
    l.onerror = () => reject(href);
    document.head.appendChild(l);
  });

  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = withTs(src);
    s.onload = resolve;
    s.onerror = () => reject(src);
    document.head.appendChild(s);
  });

  window.__bootPromise = (async function () {
    const coreFails = [];

    /* 1. 并行加载核心依赖（任一失败则展示错误） */
    try {
      await Promise.all([
        loadStyle('https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/theme.css'),
        loadStyle('index.css'),
        loadScript('https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/ui-icons.js'),
        loadScript('https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/gi-icons/icon-dict.js')
      ]);
    } catch (failUrl) {
      coreFails.push(failUrl);
      showBootError(coreFails);
      return;
    }

    /* 2. 数据字典：允许失败（编辑器可用「导入本地」兜底） */
    try {
      await loadScript('../tales/data.js');
    } catch (failUrl) {
      console.warn('[boot] 数据字典加载失败，编辑器仍可启动，请用「导入本地」：', failUrl);
    }

    /* 3. 编辑器逻辑 */
    try {
      await loadScript('index.js');
    } catch (failUrl) {
      coreFails.push(failUrl);
      showBootError(coreFails);
    }
  })();

  function showBootError(list) {
    const errBox = document.getElementById('bootErr');
    const loadBox = document.getElementById('bootLoading');
    const listBox = document.getElementById('bootErrList');
    if (!errBox || !listBox) return;
    if (loadBox) loadBox.hidden = true;
    listBox.innerHTML = list.map((u) => '<div>' + u + '</div>').join('');
    errBox.hidden = false;
  }

  document.getElementById('bootRetry')?.addEventListener('click', () => location.reload());
})();
</script>

<style>
/* =========================================================================
 * 启动期防闪（内联，先于 theme.css 生效）
 * ========================================================================= */
[hidden] { display: none !important; }

html { background: var(--bg-base, #F4F1EA); }
html[data-theme="dark"] { background: var(--bg-base, #1A1816); }

body { visibility: hidden; }
body.ready { visibility: visible; }

.boot-loading,
.boot-err {
  position: fixed; inset: 0; z-index: 99999;
  display: flex; flex-direction: column; gap: 12px;
  align-items: center; justify-content: center;
  background: var(--bg-base, #F4F1EA);
  color: var(--text-tertiary, #A69E95);
  font-size: 13px;
  font-family: var(--std-font, system-ui, sans-serif);
  visibility: visible !important;
  padding: 20px;
  text-align: center;
}
body.ready .boot-loading { display: none; }

.boot-err-title { font-size: 14px; font-weight: 600; color: var(--text-primary, #312E2B); }
.boot-err-list {
  font-size: 12px; line-height: 1.6;
  max-width: 80vw; word-break: break-all;
  color: var(--text-secondary, #7A736B);
}
.boot-err-list > div { opacity: 0.85; }

.ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 1em; height: 1em; flex-shrink: 0;
}
.ic > svg { width: 100% !important; height: 100% !important; display: block !important; }
</style>
</head>
<body>

<div class="boot-loading" id="bootLoading">正在加载编辑器…</div>
<div class="boot-err" id="bootErr" hidden>
  <div class="boot-err-title">资源加载失败</div>
  <div class="boot-err-list" id="bootErrList"></div>
  <button type="button" class="btn-sm" id="bootRetry">重试</button>
</div>

<header class="ed-header">
  <div class="ed-title-wrap">
    <h1 class="ed-title">游逸旅闻编辑器</h1>
    <span class="dirty-dot" id="dirtyDot" hidden title="有未保存的修改"></span>
  </div>
  <div class="ed-header-actions">
    <button type="button" class="btn-sm" id="btnReload" title="重载线上数据">
      <span class="ic" data-icon="reload"></span>
      <span class="ed-btn-text">重载</span>
    </button>
    <button type="button" class="btn-sm" id="btnImport" title="导入本地 data.js">
      <span class="ic" data-icon="ui.import"></span>
      <span class="ed-btn-text">导入</span>
    </button>
    <button type="button" class="btn-sm" id="btnRenumber" title="按当前显示顺序重排所有 ID">
      <span class="ic" data-icon="reorder"></span>
      <span class="ed-btn-text">重排</span>
    </button>
    <button type="button" class="btn-sm ios-btn-fill" id="btnExport" title="导出 data.js">
      <span class="ic" data-icon="ui.export"></span>
      <span class="ed-btn-text">导出</span>
    </button>
    <button type="button" class="btn-sm ed-theme-btn" id="btnTheme" aria-label="切换主题" title="切换主题">
      <span class="ic ed-theme-sun" data-icon="app.sun"></span>
      <span class="ic ed-theme-moon" data-icon="app.moon"></span>
    </button>
  </div>
</header>

<main class="ed-main">
  <aside class="ed-list-pane" id="edListPane">
    <div class="ed-filters">
      <div class="ed-search-wrap">
        <span class="ic ed-search-icon" data-icon="ui.search"></span>
        <input type="text" id="searchInput" class="ed-search-input" placeholder="搜索角色名 / 旅闻名" autocomplete="off" spellcheck="false">
        <button type="button" class="ed-search-clear" id="searchClear" aria-label="清除">
          <span class="ic" data-icon="app.close"></span>
        </button>
      </div>
      <div class="ed-filter-row">
        <button type="button" class="ed-dropdown-trigger" id="versionTrigger">
          <span class="ed-dropdown-label" id="versionLabel">全部版本</span>
          <span class="ic ed-dropdown-arrow" data-icon="ui.chevronDown"></span>
        </button>
        <button type="button" class="ed-dropdown-trigger" id="visibilityTrigger">
          <span class="ed-dropdown-label" id="visibilityLabel">全部</span>
          <span class="ic ed-dropdown-arrow" data-icon="ui.chevronDown"></span>
        </button>
      </div>
    </div>

    <div class="ed-list" id="edList"></div>

    <div class="ed-list-footer">
      <button type="button" class="ed-add-btn" id="btnAdd">
        <span class="ic" data-icon="ui.plus"></span>
        <span>新增条目</span>
      </button>
    </div>
  </aside>

  <section class="ed-form-pane" id="edFormPane"></section>
</main>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="tab-sheet-backdrop" id="sheetBackdrop"></div>
<div class="tab-sheet" id="sheet">
  <div class="tab-sheet-handle"></div>
  <div class="tab-sheet-header" id="sheetHeader"></div>
  <div class="tab-sheet-list" id="sheetList"></div>
</div>

<input type="file" id="fileInput" accept=".js,.txt,text/javascript,application/javascript" hidden>

</body>
</html>
