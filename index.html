<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>提瓦特冒险之证</title>
    <meta
      name="description"
      content="《原神》游逸旅闻与尘歌壶赠礼查询及进度记录工具 · 纯前端 · 本地记录 · 不收集数据"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- 首帧前定主题，防闪白。必须同步、必须在 CSS 之前。
         与 src/composables/useTheme.js 共用 window.__THEME_KEY，改 key 只改这一行 -->
    <script>
      window.__THEME_KEY = "adventurer-handbook-theme";
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem(window.__THEME_KEY);
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#181715" : "#f5f0e8");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
