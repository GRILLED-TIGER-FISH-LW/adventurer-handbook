<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>原神 · 游逸旅闻</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/GRILLED-TIGER-FISH-LW/genshin-guide@main/shared/theme.css">
<link rel="stylesheet" href="index.css">
</head>
<body>

<!-- ============ 顶部栏 ============ -->
<header class="app-header">
  <div class="header-top">
    <h1 class="app-title">游逸旅闻</h1>
    <div class="counter" id="counter">
      <span class="counter-label">已完成</span>
      <span class="counter-done" id="counterDone">0</span>
      <span class="counter-sep">/</span>
      <span class="counter-total" id="counterTotal">156</span>
    </div>
  </div>

  <div class="header-controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索角色名 / 游逸旅闻名" autocomplete="off" spellcheck="false">
      <button type="button" class="search-clear" id="searchClear" aria-label="清除搜索">×</button>
    </div>

    <select id="versionFilter" class="ctl-select" aria-label="版本筛选"></select>

    <select id="statusFilter" class="ctl-select" aria-label="完成状态筛选">
      <option value="all">全部</option>
      <option value="done">已完成</option>
      <option value="undone">未完成</option>
    </select>
  </div>
</header>

<!-- ============ 列表 ============ -->
<main class="app-main">
  <div class="list-host" id="listHost"></div>
  <div class="empty-state" id="emptyState" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <p>没有找到匹配的旅闻</p>
  </div>
</main>

<!-- ============ 底部操作栏 ============ -->
<div class="action-bar">
  <button type="button" class="action-btn primary" id="btnExport">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    <span>导出存档</span>
  </button>

  <button type="button" class="action-btn" id="btnImport">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    <span>导入存档</span>
  </button>

  <button type="button" class="action-btn icon-btn" id="btnTheme" aria-label="切换主题">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/gh/GRILLED-TIGER-FISH-LW/genshin-guide@main/shared/gi-icons/icon-dict.js"></script>
<script src="data.js"></script>
<script src="index.js"></script>
</body>
</html>
