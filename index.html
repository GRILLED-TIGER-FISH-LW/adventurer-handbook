<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>提瓦特冒险之证</title>
    <meta
      name="description"
      content="《原神》游逸旅闻与尘歌壶赠礼查询及进度记录工具 · 纯前端 · 本地记录 · 不收集数据"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- 首帧前定主题，防闪白。同步、必须在样式之前 -->
    <script>
      window.__THEME_KEY = "adventurer-handbook-theme";
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem(window.__THEME_KEY);
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#181715" : "#f5f0e8");
      })();
    </script>

    <!-- 加载守卫：脚本没起来时自动带时间戳重载一次，并把实际路径打出来 -->
    <script>
      (function () {
        var FLAG = "ah-recover-at";
        var failed = [];

        function lastTry() {
          try {
            return Number(sessionStorage.getItem(FLAG)) || 0;
          } catch (e) {
            return 0;
          }
        }

        function isBlank() {
          var el = document.getElementById("app");
          return el && el.children.length === 0 && !el.dataset.fatal;
        }

        function note() {
          var el = document.getElementById("app");
          if (!el || el.dataset.fatal) return;
          el.dataset.fatal = "1";

          var scripts = [];
          for (var i = 0; i < document.scripts.length; i++) {
            scripts.push("  " + (document.scripts[i].src || "(内联)"));
          }

          var lines = [
            "页面未能加载。",
            "",
            "当前地址：",
            "  " + location.href,
            "",
            "这个 HTML 引用的脚本：",
          ]
            .concat(scripts)
            .concat([
              "",
              "加载失败的脚本：",
              failed.length ? "  " + failed.join("\n  ") : "  （没有捕获到失败事件）",
              "",
              "如果你的脚本路径里没有 /adventurer-handbook/，说明打包的 base 配错了。",
              "如果路径正确但仍然失败，说明文件没有真正部署上去。",
              "",
              "请截图本页反馈。",
            ]);

          var pre = document.createElement("pre");
          pre.style.cssText =
            "position:fixed;inset:0;z-index:99999;margin:0;padding:16px;overflow:auto;" +
            "background:#181715;color:#f5f0e8;font:12px/1.7 ui-monospace,monospace;" +
            "white-space:pre-wrap;word-break:break-word";
          pre.textContent = lines.join("\n");
          el.appendChild(pre);
        }

        function recover() {
          if (!isBlank()) return;

          if (Date.now() - lastTry() < 30000) {
            note();
            return;
          }

          try {
            sessionStorage.setItem(FLAG, String(Date.now()));
          } catch (e) {}

          var base = location.href.split("#")[0].split("?")[0];
          location.replace(base + "?t=" + Date.now() + location.hash);
        }

        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") {
              failed.push(e.target.src || "(内联)");
              recover();
            }
          },
          true,
        );

        setTimeout(recover, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
