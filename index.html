<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4F1EA">
<title>提瓦特冒险之证</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">

<script>
/* =========================================================================
 * 资源加载器 (全动态 + 强制时间戳防缓存 + 完美防死锁链)
 * ========================================================================= */
(async function () {
  const ts = Date.now();
  window.__pageLoadTs = ts;
  const withTs = (url) => url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + ts;

  const loadStyle = (href) => new Promise((resolve, reject) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = withTs(href);
    l.onload = resolve; l.onerror = () => reject(new Error('CSS加载失败：' + href));
    const firstStyle = document.head.querySelector('style');
    if (firstStyle) document.head.insertBefore(l, firstStyle);
    else document.head.appendChild(l);
  });

  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = withTs(src);
    s.onload = resolve; s.onerror = () => reject(new Error('JS加载失败：' + src));
    document.head.appendChild(s);
  });

  // 核心改变：先并行加载依赖，等依赖就绪后，再去动态加载 app.js
  window.__bootPromise = Promise.all([
    loadStyle('https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/theme.css'),
    loadStyle('style.css'),
    loadScript('https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/ui-icons.js'),
    loadScript('icons.js') 
  ]).then(() => {
    // app.js 此时会被拉取，且一定带有时间戳，绝对不会走缓存
    return loadScript('app.js');
  });
})();
</script>

<style>
  body { visibility: hidden; }
  body.ready { visibility: visible; }
  .boot-loading {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base, #F4F1EA); color: var(--text-tertiary, #A69E95);
    font-size: 13px; font-family: var(--std-font, sans-serif);
    visibility: visible;
  }
  body.ready .boot-loading { display: none; }
</style>
</head>
<body>

<div class="boot-loading">正在载入冒险之证…</div>

<header class="app-navbar">
  <button type="button" class="nav-btn" id="btnMenu" aria-label="打开菜单"></button>
  <div class="nav-title">
    <span class="nav-title-icon" id="navIcon"></span>
    <span class="nav-title-text" id="navText">提瓦特冒险之证</span>
  </div>
  <button type="button" class="nav-btn" id="btnTheme" aria-label="切换主题"></button>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar-drawer" id="sidebarDrawer">
  <div class="sidebar-header">
    <h3>功能导航</h3>
    <button type="button" class="nav-btn" id="btnClose" aria-label="关闭菜单"></button>
  </div>
  <nav class="sidebar-menu" id="sidebarMenu"></nav>
</aside>

<main class="home-view" id="homeView"></main>

<main class="frame-container" id="frameContainer">
  <div class="loading-mask" id="loadingMask">
    <div class="spinner"></div>
    <span>正在载入模块…</span>
  </div>
</main>

</body>
</html>
