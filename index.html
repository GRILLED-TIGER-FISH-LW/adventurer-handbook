<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>游逸旅闻汇总</title>
<link rel="stylesheet" href="https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/theme.css">
<link rel="stylesheet" href="index.css">
</head>
<body>

<header class="app-header">
  <div class="header-row row-title">
    <h1 class="app-title">游逸旅闻汇总</h1>
    <div class="title-right">
      <div class="counter">
        <span class="counter-label">已完成</span>
        <span class="counter-done" id="counterDone">0</span>
        <span class="counter-sep">/</span>
        <span class="counter-total" id="counterTotal">156</span>
      </div>
      <button type="button" class="theme-btn" id="btnTheme" aria-label="切换主题">
        <svg class="theme-icon theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.5"></circle>
          <line x1="12" y1="2"  x2="12" y2="4"></line>
          <line x1="12" y1="20" x2="12" y2="22"></line>
          <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>
          <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
          <line x1="2" y1="12" x2="4" y2="12"></line>
          <line x1="20" y1="12" x2="22" y2="12"></line>
          <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>
          <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>
        </svg>
        <svg class="theme-icon theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="header-row row-controls">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索角色名 / 旅闻名" autocomplete="off" spellcheck="false">
      <button type="button" class="search-clear" id="searchClear" aria-label="清除">×</button>
    </div>

    <div class="dropdown-wrap" data-key="version">
      <button type="button" class="dropdown-trigger" id="versionTrigger">
        <span class="dropdown-label" id="versionLabel">全部版本</span>
        <svg class="dropdown-arrow" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1.5L6 6.5L11 1.5"/>
        </svg>
      </button>
      <div class="dropdown-panel" id="versionPanel"></div>
    </div>

    <div class="dropdown-wrap" data-key="status">
      <button type="button" class="dropdown-trigger" id="statusTrigger">
        <span class="dropdown-label" id="statusLabel">全部</span>
        <svg class="dropdown-arrow" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1.5L6 6.5L11 1.5"/>
        </svg>
      </button>
      <div class="dropdown-panel" id="statusPanel"></div>
    </div>

    <div class="dropdown-wrap" data-key="visibility">
      <button type="button" class="dropdown-trigger" id="visibilityTrigger">
        <span class="dropdown-label" id="visibilityLabel">全部</span>
        <svg class="dropdown-arrow" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1.5L6 6.5L11 1.5"/>
        </svg>
      </button>
      <div class="dropdown-panel" id="visibilityPanel"></div>
    </div>
  </div>

  <div class="header-row row-actions">
    <button type="button" class="action-btn" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>导出存档</span>
    </button>

    <button type="button" class="action-btn" id="btnImport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <span>导入存档</span>
    </button>
  </div>
</header>

<main class="app-main">
  <div class="list-host" id="listHost"></div>
  <div class="empty-state" id="emptyState" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <p>没有找到匹配的旅闻</p>
  </div>
</main>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="https://grilled-tiger-fish-lw.github.io/genshin-guide/shared/gi-icons/icon-dict.js"></script>
<script src="data.js"></script>
<script src="index.js"></script>
</body>
</html>
