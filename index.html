<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>提瓦特冒险之证</title>
    <meta
      name="description"
      content="《原神》游逸旅闻与尘歌壶赠礼查询及进度记录工具 · 纯前端 · 本地记录 · 不收集数据"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- 首帧前定主题，防闪白。同步、必须在样式之前 -->
    <script>
      window.__THEME_KEY = "adventurer-handbook-theme";
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem(window.__THEME_KEY);
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", dark);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#181715" : "#f5f0e8");
      })();
    </script>

    <!-- 加载守卫：脚本没起来时自动带时间戳重载一次，并把实际路径打出来 -->
    <script>
      (function () {
        var FLAG = "ah-recover-at";
        var failed = [];

        function lastTry() {
          try {
            return Number(sessionStorage.getItem(FLAG)) || 0;
          } catch (e) {
            return 0;
          }
        }

        function isBlank() {
          var el = document.getElementById("app");
          return el && el.children.length === 0 && !el.dataset.fatal;
        }

        function note() {
          var el = document.getElementById("app");
          if (!el || el.dataset.fatal) return;
          el.dataset.fatal = "1";

          var scripts = [];
          for (var i = 0; i < document.scripts.length; i++) {
            scripts.push("  " + (document.scripts[i].src || "(内联)"));
          }

          var lines = [
            "页面未能加载。",
            "",
            "当前地址：",
            "  " + location.href,
            "",
            "这个 HTML 引用的脚本：",
          ]
            .concat(scripts)
            .concat([
              "",
              "最常见的原因不是代码，而是网络：GitHub Pages 的 CDN 在国内经常被限速或阻断，",
              "本站首次打开要下载约 1 MB 的脚本，网速一慢就会卡在这里。",
              "",
              "请依次尝试：",
              "  1. 开代理 / VPN 后点下面「重新加载」（一开就好 = 网络问题）",
              "  2. 换 Wi-Fi 或移动数据再试",
              "  3. 等一两分钟再刷新（CDN 边缘节点有时会自己恢复）",
              "",
              "加载失败的脚本：",
              failed.length ? "  " + failed.join("\n  ") : "  （脚本可能还在下载或被中断，浏览器不会报 error）",
              "",
              "开了代理仍然这样才算真问题：确认脚本路径里有 /adventurer-handbook/（没有 = base 配错），",
              "再看 Actions 的 Deploy 是不是最后一次构建成功。",
            ]);

          var pre = document.createElement("pre");
          pre.style.cssText =
            "position:fixed;inset:0;z-index:99999;margin:0;padding:16px;overflow:auto;" +
            "background:#181715;color:#f5f0e8;font:12px/1.7 ui-monospace,monospace;" +
            "white-space:pre-wrap;word-break:break-word";
          pre.textContent = lines.join("\n");

          /* 光提示没用：给一个能点的重试按钮（原来只能手动改地址栏） */
          var retry = document.createElement("button");
          retry.textContent = "重新加载";
          retry.style.cssText =
            "margin-top:16px;padding:10px 18px;border:1px solid #57534e;border-radius:8px;" +
            "background:#292524;color:#faf9f5;font:14px system-ui;cursor:pointer";
          retry.onclick = function () {
            var base0 = location.href.split("#")[0].split("?")[0];
            location.replace(base0 + "?t=" + Date.now() + location.hash);
          };
          pre.appendChild(retry);

          el.appendChild(pre);
        }

        function recover() {
          if (!isBlank()) return;

          if (Date.now() - lastTry() < 30000) {
            note();
            return;
          }

          try {
            sessionStorage.setItem(FLAG, String(Date.now()));
          } catch (e) {}

          var base = location.href.split("#")[0].split("?")[0];
          location.replace(base + "?t=" + Date.now() + location.hash);
        }

        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") {
              failed.push(e.target.src || "(内联)");
              recover();
            }
          },
          true,
        );

        /* 首屏要下约 1 MB 脚本，4 秒在慢网下根本不够，会把「慢」误报成「失败」。
           改成每 500ms 看一眼 #app：挂载了就立刻停，12 秒还没内容才报错 */
        var waited = 0;
        var watch = setInterval(function () {
          waited += 500;
          var el = document.getElementById("app");
          if (el && el.children.length > 0 && !el.dataset.fatal) {
            clearInterval(watch);
            return;
          }
          if (waited >= 12000) {
            clearInterval(watch);
            recover();
          }
        }, 500);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
